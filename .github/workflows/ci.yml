name: Verify foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Private repositories without GitHub Advanced Security cannot run the
      # native dependency-review action. Opt in with this repository variable
      # only after GitHub reports the feature as supported; lockfile audits
      # below remain mandatory in either case.
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-20
      - name: Install Rust advisory auditor
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit --deny yanked
      - name: Audit native desktop dependencies
        # The Tauri host is a separate Cargo workspace with its own lockfile;
        # auditing only the repository-root lock silently misses it.
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock --deny yanked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Audit Node dependencies
        run: npm audit --package-lock-only --audit-level=high
        working-directory: apps/desktop
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run repository security and contract tests
        # Every test under tests/security, of which SBOM determinism is one.
        run: python -m unittest discover -s tests/security -v
      - name: Generate release SBOM
        run: python tools/generate_sbom.py --source-revision "$GITHUB_SHA" --output build/follon-sbom.cdx.json
      - name: Retain release SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: follon-sbom
          path: build/follon-sbom.cdx.json
          if-no-files-found: error

  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install semgrep==1.177.0
      - name: Static analysis (OWASP Top Ten, Rust, Python, TypeScript)
        # `temp-dir` and `args` are excluded: both fire exclusively on this
        # repository's own test fixtures and local-file CLI argument parsing
        # (verified 2026-09-20), not on a real insecure-temp-file or
        # injection pattern, so `--error` would gate the build on noise
        # rather than a finding.
        #
        # The conformance audit is excluded as a path, not a rule. The nginx
        # rules select their targets by a `conf` path glob, which the audit's
        # file name matches ("...-conformance-audit.md"), and the audit is
        # prose that quotes the Host-header defect item 41 fixed. Excluding
        # the rule instead would stop scanning infra/nginx.dashboard.conf;
        # re-injecting that defect there still fails this step (verified
        # 2026-09-28). The audit's secrets coverage remains with gitleaks.
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/rust \
            --config p/python \
            --config p/typescript \
            --config p/secrets \
            --exclude-rule rust.lang.security.temp-dir.temp-dir \
            --exclude-rule rust.lang.security.args.args \
            --exclude docs/06-delivery/14-master-plan-conformance-audit.md \
            --metrics=off \
            --error

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-20
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: follon_test
          POSTGRES_USER: follon
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U follon -d follon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-20
      - name: Run transactional PostgreSQL integration test
        env:
          FOLLON_TEST_DATABASE_URL: postgresql://follon:integration-only-password@127.0.0.1:5432/follon_test
        run: cargo test -p follon-postgres -- --ignored

  python-and-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate JSON contract syntax
        run: python -c "import json, pathlib; [json.load(path.open(encoding='utf-8')) for path in pathlib.Path('contracts/json-schema').rglob('*.json')]"
      - name: Run strategy SDK contract tests
        env:
          PYTHONPATH: python/strategy-sdk/src
        run: python -m unittest discover -s python/strategy-sdk/tests -v
      - name: Run IBKR bridge protocol tests
        env:
          PYTHONPATH: python/ibkr-gateway/src
        run: python -m unittest discover -s python/ibkr-gateway/tests -v
      - name: Install storage adapter
        run: python -m pip install python/storage-adapter
      - name: Run storage adapter tests
        run: python -m unittest discover -s python/storage-adapter/tests -v
      - name: Run dashboard server contract tests
        run: python apps/desktop/test/server_contract.py

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-20
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run typecheck
        working-directory: apps/desktop
      - run: npm run test:evidence
        working-directory: apps/desktop
      - run: npm run build:web
        working-directory: apps/desktop
      - name: Install Tauri Linux prerequisites
        # Tauri v2's documented Ubuntu prerequisites. `glib-sys`, `gtk` and
        # `webkit2gtk` find these system libraries through pkg-config when
        # the native host compiles, so clippy and the native tests cannot
        # build without them. Before this step the job stopped at clippy with
        # "Package glib-2.0 was not found in the pkg-config search path".
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Check native formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Lint native command boundary
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run native command-boundary tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
