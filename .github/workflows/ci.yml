name: Verify foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Private repositories without GitHub Advanced Security cannot run the
      # native dependency-review action. Opt in with this repository variable
      # only after GitHub reports the feature as supported; lockfile audits
      # below remain mandatory in either case.
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust advisory auditor
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Audit Node dependencies
        run: npm audit --package-lock-only --audit-level=high
        working-directory: apps/desktop

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python-and-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON contract syntax
        run: python -c "import json, pathlib; [json.load(path.open(encoding='utf-8')) for path in pathlib.Path('contracts/json-schema').rglob('*.json')]"
      - name: Run strategy SDK contract tests
        env:
          PYTHONPATH: python/strategy-sdk/src
        run: python -m unittest discover -s python/strategy-sdk/tests -v
      - name: Run IBKR bridge protocol tests
        env:
          PYTHONPATH: python/ibkr-gateway/src
        run: python -m unittest discover -s python/ibkr-gateway/tests -v
      - name: Install storage adapter
        run: python -m pip install python/storage-adapter
      - name: Run storage adapter tests
        run: python -m unittest discover -s python/storage-adapter/tests -v

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run typecheck
        working-directory: apps/desktop
      - run: npm run test:evidence
        working-directory: apps/desktop
