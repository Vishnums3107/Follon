[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "follon-strategy-sdk"
version = "0.1.0"
description = "Safe, broker-independent strategy contracts for Follon"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Follon Contributors" }]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
