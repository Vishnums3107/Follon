[package]
name = "follon-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
follon-accounting = { path = "../../core/accounting" }
follon-backtest = { path = "../../core/backtest" }
follon-control-plane = { path = "../../core/control-plane" }
follon-commercial = { path = "../../core/commercial" }
follon-domain = { path = "../../core/domain" }
follon-execution = { path = "../../core/execution" }
follon-instrument = { path = "../../core/instrument" }
follon-live = { path = "../../core/live" }
follon-market-data = { path = "../../core/market-data" }
follon-news = { path = "../../core/news" }
follon-operations = { path = "../../core/operations" }
follon-options = { path = "../../core/options" }
follon-paper = { path = "../../core/paper" }
follon-risk = { path = "../../core/risk" }
follon-secrets = { path = "../../core/secrets" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
time = { version = "0.3.44", features = ["parsing"] }

[[bin]]
name = "follon-replay"
path = "src/main.rs"

[[bin]]
name = "follon-backtest"
path = "src/backtest.rs"

[[bin]]
name = "follon-build-bars"
path = "src/build_bars.rs"

[[bin]]
name = "follon-paper-status"
path = "src/paper.rs"

[[bin]]
name = "follon-live-status"
path = "src/live.rs"

[[bin]]
name = "follon-operations"
path = "src/operations.rs"

[[bin]]
name = "follon-options"
path = "src/options.rs"

[[bin]]
name = "follon-admin"
path = "src/admin.rs"

[[bin]]
name = "follon-tca"
path = "src/tca.rs"

[[bin]]
name = "follon-risk-benchmark"
path = "src/risk_benchmark.rs"

[[bin]]
name = "follon-news"
path = "src/news_cli.rs"

[lints]
workspace = true
