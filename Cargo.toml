[workspace]
members = [
    "core/domain",
    "core/instrument",
    "core/market-data",
    "core/backtest",
    "core/commercial",
    "core/operations",
    "core/options",
    "core/paper",
    "core/live",
    "core/secrets",
    "core/control-plane",
    "apps/cli",
    "adapters/brokers/ibkr",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Follon Contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
