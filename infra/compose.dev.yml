name: follon-dev

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: follon
      POSTGRES_USER: follon
      POSTGRES_PASSWORD: ${FOLLON_POSTGRES_PASSWORD:?Set FOLLON_POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:${FOLLON_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U follon -d follon"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - follon-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: follon-local
      MINIO_ROOT_PASSWORD: ${FOLLON_MINIO_PASSWORD:?Set FOLLON_MINIO_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - follon-minio:/data

  dashboard:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dashboard
    ports:
      - "127.0.0.1:${FOLLON_DASHBOARD_PORT:-8080}:8080"
    environment:
      FOLLON_DASHBOARD_HOST: 0.0.0.0
      FOLLON_DASHBOARD_PORT: 8080
      FOLLON_DASHBOARD_MODE: ${FOLLON_DASHBOARD_MODE:-development}
      FOLLON_DASHBOARD_USERNAME: ${FOLLON_DASHBOARD_USERNAME:-}
      FOLLON_DASHBOARD_PASSWORD: ${FOLLON_DASHBOARD_PASSWORD:-}
      FOLLON_POSTGRES_HOST: postgres
      FOLLON_POSTGRES_INTERNAL_PORT: 5432
      FOLLON_MINIO_HEALTH_URL: http://minio:9000/minio/health/live
      FOLLON_TRADING_API_HOST: trading-api
      FOLLON_TRADING_API_PORT: 50051
    volumes:
      - ../var:/var/follon:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    pids_limit: 100
    mem_limit: 192m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      trading-api:
        condition: service_healthy

  trading-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.trading-api
    environment:
      FOLLON_DEPLOYMENT_MODE: development
      FOLLON_GRPC_BIND: 0.0.0.0:50051
      FOLLON_DATABASE_URL: postgresql://follon:${FOLLON_POSTGRES_PASSWORD:?Set FOLLON_POSTGRES_PASSWORD in infra/.env}@postgres:5432/follon
    ports:
      - "127.0.0.1:${FOLLON_GRPC_PORT:-50051}:50051"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/follon-trading-api", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  storage:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.storage
    environment:
      AWS_ACCESS_KEY_ID: follon-local
      AWS_SECRET_ACCESS_KEY: ${FOLLON_MINIO_PASSWORD:?Set FOLLON_MINIO_PASSWORD in infra/.env}
      AWS_REGION: us-east-1
      FOLLON_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ../var:/var/follon:rw
      - ../tests/fixtures:/fixtures:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    pids_limit: 100
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      minio:
        condition: service_healthy

volumes:
  follon-postgres:
  follon-minio:
