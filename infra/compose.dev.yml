name: follon-dev

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: follon
      POSTGRES_USER: follon
      POSTGRES_PASSWORD: ${FOLLON_POSTGRES_PASSWORD:?Set FOLLON_POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U follon -d follon"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - follon-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: follon-local
      MINIO_ROOT_PASSWORD: ${FOLLON_MINIO_PASSWORD:?Set FOLLON_MINIO_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - follon-minio:/data

volumes:
  follon-postgres:
  follon-minio:
